name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Quality, Build, OpenAPI & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: janasahayak_test
          POSTGRES_USER: janasahayak
          POSTGRES_PASSWORD: janasahayak_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U janasahayak -d janasahayak_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://janasahayak:janasahayak_ci_password@127.0.0.1:5432/janasahayak_test
      DATABASE_SSL: 'false'
      API_CORS_ORIGINS: http://localhost:3000
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:4000/api/v1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run linter
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Build all workspaces
        run: npm run build

      - name: Run database bootstrap migrations
        run: npm run db:migrate

      - name: Validate OpenAPI specification
        run: npm run openapi:validate

      - name: Run tests
        run: npm run test

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high
