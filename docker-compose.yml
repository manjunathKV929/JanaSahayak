services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: janasahayak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-janasahayak_dev}
      POSTGRES_USER: ${POSTGRES_USER:-janasahayak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_dev_only}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - janasahayak_pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-janasahayak} -d ${POSTGRES_DB:-janasahayak_dev}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  janasahayak_pgdata:
